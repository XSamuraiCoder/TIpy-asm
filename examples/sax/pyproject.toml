[tool.tipy]
name = "SAXCE"
description = "SAX chat for the TI-84 Plus CE"
main = "src/main.py"
target = "ce"
bindir = "bin"

# Fonts for y=: every font in the SAXFONT font pack. A font asset converts a .fnt
# or .convfont file with TIpy-asm's convfont, for example CEdev's DrSans fonts
# from examples/library_examples/fontlibc/font_pack/src/fonts. For a pack with
# several fonts, run: tipy-asm convfont -o fontpack -N SAXFONT -f a.fnt -f b.fnt SAXFONT.8xv
