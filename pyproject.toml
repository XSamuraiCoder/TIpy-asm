[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tipy-asm"
version = "1.0.1"
description = "TIpy-asm: Python compiler for TI-84 Z80/eZ80 calculators"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.optional-dependencies]
images = ["Pillow>=10"]

[project.scripts]
tipy-asm = "ti84asm.cli:main"
ti84py = "ti84asm.cli:main"
convbin = "ti84asm.convbin:run_with_args"
convimg = "ti84asm.convimg:run_with_args"
convfont = "ti84asm.convfont:run_with_args"

[tool.setuptools]
packages = [
    "ti84asm",
    "ti84asm.project_convert",
    "ti84asm.installer",
    "ti84asm.toolchain",
    "ti84asm.toolchain.bin",
    "ti84asm.toolchain.include",
    "ti84libs",
    "ti84",
]

[tool.setuptools.package-data]
ti84asm = ["toolchain/bin/*", "toolchain/include/*", "toolchain/*.txt", "installer/*.py", "installer/*.asm"]
ti84 = ["*.pyi", "py.typed"]