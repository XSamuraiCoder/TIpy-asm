[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "py2ez80"
version = "0.1.0"
description = "Python-based py2ez80 compiler for TI-84 Z80/eZ80 calculators"
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
py2ez80 = "ti84asm.cli:main"
ti84py = "ti84asm.cli:main"

[tool.setuptools]
packages = ["ti84asm", "ti84libs"]
